<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کیبورد فارسی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="js.js">

</head>
<body>

    <div class="keyboard">

        <input type="text" id="text" placeholder="متن خود را اینجا وارد کنید">

        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button class="clear">پاک کردن</button>
        </div>

        <div class="row">
            <button>ض</button>
            <button>ص</button>
            <button>ث</button>
            <button>ق</button>
            <button>ف</button>
            <button>غ</button>
            <button>ع</button>
            <button>ه</button>
            <button>خ</button>
            <button>ح</button>
            <button>ج</button>
            <button>چ</button>
        </div>

        <div class="row">
            <button>ش</button>
            <button>س</button>
            <button>ی</button>
            <button>ب</button>
            <button>ل</button>
            <button>ا</button>
            <button>ت</button>
            <button>ن</button>
            <button>م</button>
            <button>ک</button>
            <button>گ</button>
            <button>و</button>
        </div>

        <div class="row">
            <button>ظ</button>
            <button>ط</button>
            <button>ز</button>
            <button>ر</button>
            <button>ذ</button>
            <button>د</button>
            <button>پ</button>
            <button>ژ</button>
            <button>.</button>
            <button>،</button>
            <button class="space">فاصله</button>
        </div>

    </div>

    <script >
        let text = document.getElementById("text");

let buttons = document.querySelectorAll(".row button");

buttons.forEach(function(button) {

    button.addEventListener("click", function() {

        let value = button.innerText;

        if (button.classList.contains("clear")) {
            text.value = "";
        }

        else if (button.classList.contains("space")) {
            text.value += " ";
        }

        else {
            text.value += value;
        }

    });

});
    </script>
</body>
</html>
